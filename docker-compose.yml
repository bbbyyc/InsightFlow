name: insightflow

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-insightflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-insightflow}
  REDIS_URL: redis://redis:6379/0
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in .env for the complete product stack}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  EMBEDDING_CACHE_DIR: /models/fastembed
  HF_HOME: /models/huggingface
  XDG_CACHE_HOME: /models/cache
  CHUNK_SIZE: ${CHUNK_SIZE:-1000}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
  UPLOAD_DIR: /app/data/uploads
  EVALUATION_OUTPUT_DIR: /app/data/evaluations
  EVALUATION_SCRIPT: /eval/run_eval.py
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
  TASK_MAX_RETRIES: ${TASK_MAX_RETRIES:-3}
  TASK_RETRY_BACKOFF_SECONDS: ${TASK_RETRY_BACKOFF_SECONDS:-5}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

x-backend-service: &backend-service
  image: insightflow-backend:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: *backend-environment
  restart: unless-stopped
  volumes:
    - uploads:/app/data/uploads
    - evaluations:/app/data/evaluations
    - model_cache:/models

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insightflow}
      POSTGRES_USER: ${POSTGRES_USER:-insightflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  migrate:
    <<: *backend-service
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evaluations:/app/data/evaluations
      - model_cache:/models

  backend:
    <<: *backend-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    <<: *backend-service
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=info", "--concurrency=${CELERY_CONCURRENCY:-1}"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks inspect ping --destination celery@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s

  frontend:
    image: insightflow-frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  mcp:
    <<: *backend-service
    profiles: ["mcp"]
    command: ["python", "-m", "app.run_mcp"]
    ports:
      - "${MCP_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
  redisdata:
  uploads:
  evaluations:
  model_cache:
